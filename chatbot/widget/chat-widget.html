<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FoodLink Assistant</title>
  <meta name="description" content="FoodLink conversational food-rescue chatbot widget." />

  <!-- Google Fonts: Plus Jakarta Sans & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
      background: #f4f6f4;
      overflow: hidden;
    }
  </style>

  <!-- FoodLink Chat Widget Styles -->
  <link rel="stylesheet" href="chat-widget.css" />
</head>
<body>

  <!-- FoodLink Chat Widget Embed & Config -->
  <script>
    window.ANNASETUCHAT_CONFIG = {
      backendUrl:  window.location.origin.startsWith("http") ? window.location.origin : "http://localhost:8001",
      defaultRole: "donor",
      lang:        "en",
      autoOpen:    true,
    };
  </script>
  <script src="chat-widget.js"></script>

</body>
</html>
